AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Onward Logistics - 00 bootstrap. The single stack that cannot deploy itself through
  GitSync, because it creates the role GitSync uses. Deployed ONCE with the AWS CLI
  (see README "Rebuild from scratch"). Creates the GitSync / CloudFormation role and,
  optionally, the CodeConnections GitHub connection. No inline policies.

Parameters:
  ResourcePrefix:
    Type: String
    Default: onward-orders-lab
    AllowedPattern: "^[a-z][a-z0-9-]{2,24}$"
    Description: Naming prefix <project>-<environment> applied to every resource.
  ExistingConnectionArn:
    Type: String
    Default: ""
    Description: >-
      ARN of an existing AVAILABLE CodeConnections GitHub connection. Leave empty to create a
      new one (it starts PENDING and needs the one-time GitHub authorization in the console).

Conditions:
  CreateConnection: !Equals [!Ref ExistingConnectionArn, ""]

Resources:
  # CodeConnections link to GitHub, created only when no existing connection ARN is given.
  GitHubConnection:
    Type: AWS::CodeConnections::Connection
    Condition: CreateConnection
    Properties:
      ConnectionName: !Sub ${ResourcePrefix}-github
      ProviderType: GitHub

  # Permissions GitSync needs to create change sets and manage its EventBridge rules.
  GitSyncPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${ResourcePrefix}-gitsync-sync-policy
      Description: Lets CloudFormation GitSync create change sets and manage its EventBridge rules.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SyncToCloudFormation
            Effect: Allow
            Action:
              - cloudformation:CreateChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStacks
              - cloudformation:ExecuteChangeSet
              - cloudformation:GetTemplate
              - cloudformation:ListChangeSets
              - cloudformation:ListStacks
              - cloudformation:ValidateTemplate
            Resource: "*"
          - Sid: PolicyForManagedRules
            Effect: Allow
            Action:
              - events:PutRule
              - events:PutTargets
            Resource: "*"
            Condition:
              StringEquals:
                events:ManagedBy:
                  - cloudformation.sync.codeconnections.amazonaws.com
          - Sid: PolicyForDescribingRule
            Effect: Allow
            Action: events:DescribeRule
            Resource: "*"

  # Permissions CloudFormation needs to build stacks 01-06. Resource is "*" where ARNs do not exist until creation.
  StackDeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${ResourcePrefix}-gitsync-deploy-policy
      Description: Resource permissions for the Onward Orders stacks deployed through GitSync.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ServicesUsedByStacks
            Effect: Allow
            Action:
              - ec2:*
              - elasticloadbalancing:*
              - ecs:*
              - ecr:*
              - logs:*
              - cloudwatch:*
              - application-autoscaling:*
              - codedeploy:*
              - codepipeline:*
              - events:*
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:PutParameter
              - ssm:DeleteParameter
              - ssm:AddTagsToResource
              - ssm:RemoveTagsFromResource
              - ssm:ListTagsForResource
            Resource: "*"
          - Sid: ArtifactBucket
            Effect: Allow
            Action: s3:*
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${ResourcePrefix}-*
              - !Sub arn:${AWS::Partition}:s3:::${ResourcePrefix}-*/*
          - Sid: IamScopedToPrefix
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:UpdateRole
              - iam:UpdateAssumeRolePolicy
              - iam:TagRole
              - iam:UntagRole
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:ListAttachedRolePolicies
              - iam:ListRolePolicies
              - iam:PassRole
              - iam:CreatePolicy
              - iam:DeletePolicy
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:ListPolicyVersions
              - iam:CreatePolicyVersion
              - iam:DeletePolicyVersion
              - iam:TagPolicy
              - iam:UntagPolicy
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ResourcePrefix}-*
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${ResourcePrefix}-*
          - Sid: GitHubOidcProvider
            Effect: Allow
            Action:
              - iam:CreateOpenIDConnectProvider
              - iam:DeleteOpenIDConnectProvider
              - iam:GetOpenIDConnectProvider
              - iam:UpdateOpenIDConnectProviderThumbprint
              - iam:AddClientIDToOpenIDConnectProvider
              - iam:RemoveClientIDFromOpenIDConnectProvider
              - iam:TagOpenIDConnectProvider
              - iam:UntagOpenIDConnectProvider
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
          - Sid: ServiceLinkedRoles
            Effect: Allow
            Action: iam:CreateServiceLinkedRole
            Resource: "*"
            Condition:
              StringLike:
                iam:AWSServiceName:
                  - ecs.amazonaws.com
                  - ecs.application-autoscaling.amazonaws.com
                  - elasticloadbalancing.amazonaws.com
          - Sid: UseGitHubConnection
            Effect: Allow
            Action:
              - codeconnections:PassConnection
              - codeconnections:UseConnection
              - codestar-connections:PassConnection
              - codestar-connections:UseConnection
            Resource: "*"

  # One role serving as both the GitSync sync role and the CloudFormation stack role.
  GitSyncRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ResourcePrefix}-gitsync-role
      Description: Assumed by CloudFormation GitSync to sync and deploy the Onward Orders stacks.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - cloudformation.sync.codeconnections.amazonaws.com
                - cloudformation.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Ref GitSyncPolicy
        - !Ref StackDeployPolicy

Outputs:
  GitSyncRoleArn:
    Description: Role to select when creating each GitSync stack.
    Value: !GetAtt GitSyncRole.Arn
    Export:
      Name: !Sub ${ResourcePrefix}-gitsync-role-arn
  ConnectionArn:
    Description: CodeConnections GitHub connection used by GitSync and CodePipeline.
    Value:
      !If [
        CreateConnection,
        !GetAtt GitHubConnection.ConnectionArn,
        !Ref ExistingConnectionArn,
      ]
    Export:
      Name: !Sub ${ResourcePrefix}-github-connection-arn
