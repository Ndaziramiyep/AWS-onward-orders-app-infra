AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Onward Logistics - 03 load balancer. The only public resource: an internet-facing ALB in the
  public subnets with a production listener (blue) and a test listener (green) used by
  CodeDeploy blue/green. Target groups use target type ip (required for Fargate awsvpc).

Parameters:
  ResourcePrefix:
    Type: String
    Default: onward-orders-lab
    AllowedPattern: "^[a-z][a-z0-9-]{2,24}$"
    Description: Naming prefix <project>-<environment> applied to every resource.
  CertificateArn:
    Type: String
    Default: ""
    Description: Optional ACM certificate. If set, production runs on 443 and port 80 redirects to it.
  TestListenerPort:
    Type: Number
    Default: 8080
  AppPort:
    Type: Number
    Default: 8080
  HealthCheckPath:
    Type: String
    Default: /health

Conditions:
  HasCertificate: !Not
    - !Equals
        - !Ref CertificateArn
        - ""

Resources:
  # Internet-facing ALB in the public subnets, the only public resource.
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${ResourcePrefix}-alb
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets: !Split
        - ","
        - !ImportValue
          "Fn::Sub": "${ResourcePrefix}-public-subnet-ids"
      SecurityGroups:
        - !ImportValue
          "Fn::Sub": "${ResourcePrefix}-alb-sg-id"
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        - Key: idle_timeout.timeout_seconds
          Value: "60"
        - Key: deletion_protection.enabled
          Value: "false"
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-alb"

  # Blue target group, serving production traffic.
  BlueTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${ResourcePrefix}-tg-blue
      VpcId: !ImportValue
        "Fn::Sub": "${ResourcePrefix}-vpc-id"
      TargetType: ip
      Protocol: HTTP
      Port: !Ref AppPort
      HealthCheckProtocol: HTTP
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-tg-blue"

  # Green target group, receiving the new version during a deployment.
  GreenTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${ResourcePrefix}-tg-green
      VpcId: !ImportValue
        "Fn::Sub": "${ResourcePrefix}-vpc-id"
      TargetType: ip
      Protocol: HTTP
      Port: !Ref AppPort
      HealthCheckProtocol: HTTP
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-tg-green"

  # Production listener: HTTPS with a certificate, otherwise HTTP on port 80.
  ProductionListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: !If
        - HasCertificate
        - 443
        - 80
      Protocol: !If
        - HasCertificate
        - HTTPS
        - HTTP
      SslPolicy: !If
        - HasCertificate
        - ELBSecurityPolicy-TLS13-1-2-2021-06
        - !Ref AWS::NoValue
      Certificates: !If
        - HasCertificate
        -   - CertificateArn: !Ref CertificateArn
        - !Ref AWS::NoValue
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BlueTargetGroup

  # Redirects HTTP to HTTPS, only when a certificate is set.
  HttpRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  # Test listener CodeDeploy uses to check the green version before shifting traffic.
  TestListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: !Ref TestListenerPort
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref GreenTargetGroup

Outputs:
  LoadBalancerDnsName:
    Description: Open this in a browser.
    Value: !GetAtt LoadBalancer.DNSName
    Export:
      Name: !Sub "${ResourcePrefix}-alb-dns"
  LoadBalancerFullName:
    Value: !GetAtt LoadBalancer.LoadBalancerFullName
    Export:
      Name: !Sub "${ResourcePrefix}-alb-full-name"
  ProductionListenerArn:
    Value: !Ref ProductionListener
    Export:
      Name: !Sub "${ResourcePrefix}-prod-listener-arn"
  TestListenerArn:
    Value: !Ref TestListener
    Export:
      Name: !Sub "${ResourcePrefix}-test-listener-arn"
  BlueTargetGroupArn:
    Value: !Ref BlueTargetGroup
    Export:
      Name: !Sub "${ResourcePrefix}-tg-blue-arn"
  BlueTargetGroupName:
    Value: !GetAtt BlueTargetGroup.TargetGroupName
    Export:
      Name: !Sub "${ResourcePrefix}-tg-blue-name"
  BlueTargetGroupFullName:
    Value: !GetAtt BlueTargetGroup.TargetGroupFullName
    Export:
      Name: !Sub "${ResourcePrefix}-tg-blue-full-name"
  GreenTargetGroupName:
    Value: !GetAtt GreenTargetGroup.TargetGroupName
    Export:
      Name: !Sub "${ResourcePrefix}-tg-green-name"
  GreenTargetGroupFullName:
    Value: !GetAtt GreenTargetGroup.TargetGroupFullName
    Export:
      Name: !Sub "${ResourcePrefix}-tg-green-full-name"
