AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Onward Logistics - 05 auto scaling. Target tracking on CPU and memory keeps the order service
  between MinCapacity and MaxCapacity with no manual action. Optional office-hours schedule
  scales to zero overnight (Finance: idle environments should not cost money).

Parameters:
  ResourcePrefix:
    Type: String
    Default: onward-orders-lab
    AllowedPattern: "^[a-z][a-z0-9-]{2,24}$"
    Description: Naming prefix <project>-<environment> applied to every resource.
  MinCapacity:
    Type: Number
    Default: 2
    MinValue: 0
    Description: 2 = one task per AZ, survives a task or AZ failure. Set 0 (and MaxCapacity 0) to idle.
  MaxCapacity:
    Type: Number
    Default: 6
    MinValue: 0
  CpuTargetPercent:
    Type: Number
    Default: 55
    MinValue: 20
    MaxValue: 90
  MemoryTargetPercent:
    Type: Number
    Default: 75
    MinValue: 20
    MaxValue: 90
  ScaleOutCooldown:
    Type: Number
    Default: 60
    Description: Short - react quickly to peak-day load.
  ScaleInCooldown:
    Type: Number
    Default: 300
    Description: Longer than scale-out to avoid flapping.
  EnableOfficeHoursSchedule:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: If true, scale to 0 at 19:00 and back to MinCapacity at 07:00 (Mon-Fri, UTC).

Conditions:
  UseSchedule: !Equals [!Ref EnableOfficeHoursSchedule, "true"]

Resources:
  # Scaling bounds for the service, with an optional overnight scale-to-zero schedule.
  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub
        - service/${Cluster}/${Service}
        - Cluster: !ImportValue { "Fn::Sub": "${ResourcePrefix}-cluster-name" }
          Service: !ImportValue { "Fn::Sub": "${ResourcePrefix}-service-name" }
      MinCapacity: !Ref MinCapacity
      MaxCapacity: !Ref MaxCapacity
      RoleARN: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService
      ScheduledActions: !If
        - UseSchedule
        - - ScheduledActionName: !Sub ${ResourcePrefix}-evening-scale-to-zero
            Schedule: cron(0 19 ? * MON-FRI *)
            ScalableTargetAction: { MinCapacity: 0, MaxCapacity: 0 }
          - ScheduledActionName: !Sub ${ResourcePrefix}-morning-scale-up
            Schedule: cron(0 7 ? * MON-FRI *)
            ScalableTargetAction: { MinCapacity: !Ref MinCapacity, MaxCapacity: !Ref MaxCapacity }
        - !Ref AWS::NoValue

  # Scales on CPU. ALBRequestCountPerTarget is not used: blue/green swaps target groups, so it would go stale.
  CpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub ${ResourcePrefix}-cpu-target-tracking
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: !Ref CpuTargetPercent
        ScaleOutCooldown: !Ref ScaleOutCooldown
        ScaleInCooldown: !Ref ScaleInCooldown

  # Scales on memory.
  MemoryScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub ${ResourcePrefix}-memory-target-tracking
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageMemoryUtilization
        TargetValue: !Ref MemoryTargetPercent
        ScaleOutCooldown: !Ref ScaleOutCooldown
        ScaleInCooldown: !Ref ScaleInCooldown

Outputs:
  ScalableTargetId:
    Value: !Ref ScalableTarget
