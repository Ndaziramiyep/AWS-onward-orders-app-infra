AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Onward Logistics - 01 foundation. GitHub OIDC provider, the GitHub Actions role (ECR push and
  deploy-bundle upload only, trusted for the app repo main branch only), the private ECR
  repository, and the deploy bundle bucket (taskdef.json + appspec.yaml zipped by GitHub Actions).
  No IAM users, no access keys, no inline policies.

Parameters:
  ResourcePrefix:
    Type: String
    Default: onward-orders-lab
    AllowedPattern: "^[a-z][a-z0-9-]{2,24}$"
    Description: Naming prefix <project>-<environment> applied to every resource.
  GitHubOrg:
    Type: String
    Default: Ndaziramiyep
    Description: GitHub user or organisation that owns the application repository.
  AppRepo:
    Type: String
    Default: AWS-onward-orders-app
    Description: Name of the application repository (the only repo allowed to push images).
  AppBranch:
    Type: String
    Default: main
    Description: Only workflows running on this branch can assume the role.
  ExistingOidcProviderArn:
    Type: String
    Default: ""
    Description: >-
      Leave empty to create the GitHub OIDC provider. An account can hold only one provider per
      URL, so if one already exists, paste its ARN here and it will be reused.
  ShaImagesToKeep:
    Type: Number
    Default: 20
    MinValue: 5
    Description: Number of git-SHA tagged images kept in ECR for rollback.
  BundleObjectKey:
    Type: String
    Default: deploy/bundle.zip
    AllowedPattern: "^[a-zA-Z0-9_./-]+\\.zip$"
    Description: >-
      S3 key GitHub Actions uploads the deploy bundle to (a zip holding taskdef.json and
      appspec.yaml at its root). The pipeline's S3 source action reads the same key.

Conditions:
  CreateOidcProvider: !Equals
    - !Ref ExistingOidcProviderArn
    - ""

Resources:
  # GitHub OIDC identity provider. IAM trusts GitHub's CA; thumbprints are kept for older tooling.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-github-oidc"

  # Private image repository. SHA tags are immutable; only "latest" moves, because the pipeline watches it.
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref ResourcePrefix
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      ImageTagMutability: IMMUTABLE_WITH_EXCLUSION
      ImageTagMutabilityExclusionFilters:
        - ImageTagMutabilityExclusionFilterType: WILDCARD
          ImageTagMutabilityExclusionFilterValue: latest
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 1 day",
                "selection": { "tagStatus": "untagged", "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 1 },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Keep the last ${ShaImagesToKeep} images for rollback",
                "selection": { "tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": ${ShaImagesToKeep} },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Ref ResourcePrefix

  # Deploy bundle bucket. GitHub Actions uploads taskdef.json + appspec.yaml as one zip and the
  # pipeline reads it. The CodePipeline S3 source action requires versioning. The bucket is here,
  # not in 06, because the first image and bundle are pushed before the 06 delivery stack exists.
  BundleBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${ResourcePrefix}-bundle-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-bundles
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
              NewerNoncurrentVersions: 20
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-bundle"

  # Denies any non-HTTPS access to the bundle bucket.
  BundleBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BundleBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt BundleBucket.Arn
              - !Sub ${BundleBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # Upload the deploy bundle to its one key and nothing else.
  GitHubActionsBundlePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${ResourcePrefix}-github-bundle-upload-policy
      Description: Upload the deploy bundle (taskdef.json + appspec.yaml zip) to its one S3 key only.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: UploadBundleOnly
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub ${BundleBucket.Arn}/${BundleObjectKey}

  # Push access to this repository only.
  GitHubActionsPushPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${ResourcePrefix}-github-ecr-push-policy
      Description: Push images to the Onward Orders ECR repository only.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EcrLogin
            Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: "*"
          - Sid: PushToThisRepositoryOnly
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:PutImage
              - ecr:BatchGetImage
              - ecr:DescribeImages
            Resource: !GetAtt EcrRepository.Arn

  # Read-only view of the release pipeline, so the app workflow can wait for the AWS release to finish.
  # The pipeline is created later by the 06 delivery stack, so its ARN is built from the naming convention.
  GitHubActionsReleasePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${ResourcePrefix}-github-release-status-policy
      Description: Read the status of the Onward Orders release pipeline only.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadReleasePipelineOnly
            Effect: Allow
            Action:
              - codepipeline:ListPipelineExecutions
              - codepipeline:GetPipelineExecution
              - codepipeline:GetPipelineState
            Resource: !Sub arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${ResourcePrefix}-pipeline

  # Role GitHub Actions assumes via OIDC, limited to the app repo's main branch (both subject formats).
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ResourcePrefix}-github-actions-role
      # Description kept unchanged on purpose: changing it needs iam:UpdateRoleDescription, which the GitSync role lacks.
      Description: Assumed by GitHub Actions via OIDC (temporary credentials only) to push images.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOrg}/${AppRepo}:ref:refs/heads/${AppBranch}
                  - !Sub repo:${GitHubOrg}@*/${AppRepo}@*:ref:refs/heads/${AppBranch}
      ManagedPolicyArns:
        - !Ref GitHubActionsPushPolicy
        - !Ref GitHubActionsBundlePolicy
        - !Ref GitHubActionsReleasePolicy
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-github-actions-role"

Outputs:
  EcrRepositoryName:
    Value: !Ref EcrRepository
    Export:
      Name: !Sub "${ResourcePrefix}-ecr-repo-name"
  EcrRepositoryArn:
    Value: !GetAtt EcrRepository.Arn
    Export:
      Name: !Sub "${ResourcePrefix}-ecr-repo-arn"
  EcrRepositoryUri:
    Value: !GetAtt EcrRepository.RepositoryUri
    Export:
      Name: !Sub "${ResourcePrefix}-ecr-repo-uri"
  GitHubActionsRoleArn:
    Description: Paste into the app repo workflow (role-to-assume). Not a secret.
    Value: !GetAtt GitHubActionsRole.Arn
    Export:
      Name: !Sub "${ResourcePrefix}-github-actions-role-arn"
  BundleBucketName:
    Description: Bucket GitHub Actions uploads the deploy bundle to (BUNDLE_BUCKET in the app workflow).
    Value: !Ref BundleBucket
    Export:
      Name: !Sub "${ResourcePrefix}-bundle-bucket-name"
  BundleBucketArn:
    Value: !GetAtt BundleBucket.Arn
    Export:
      Name: !Sub "${ResourcePrefix}-bundle-bucket-arn"
  BundleObjectKey:
    Description: S3 key of the deploy bundle (BUNDLE_KEY in the app workflow).
    Value: !Ref BundleObjectKey
    Export:
      Name: !Sub "${ResourcePrefix}-bundle-object-key"
