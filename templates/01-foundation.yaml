AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Onward Logistics - 01 foundation. GitHub OIDC provider, the GitHub Actions role (ECR push
  only, trusted for the app repo main branch only), and the private ECR repository.
  No IAM users, no access keys, no inline policies.

Parameters:
  ResourcePrefix:
    Type: String
    Default: onward-orders-lab
    AllowedPattern: "^[a-z][a-z0-9-]{2,24}$"
    Description: Naming prefix <project>-<environment> applied to every resource.
  GitHubOrg:
    Type: String
    Default: Ndaziramiyep
    Description: GitHub user or organisation that owns the application repository.
  AppRepo:
    Type: String
    Default: AWS-onward-orders-app
    Description: Name of the application repository (the only repo allowed to push images).
  AppBranch:
    Type: String
    Default: main
    Description: Only workflows running on this branch can assume the role.
  ExistingOidcProviderArn:
    Type: String
    Default: ""
    Description: >-
      Leave empty to create the GitHub OIDC provider. An account can hold only one provider per
      URL, so if one already exists, paste its ARN here and it will be reused.
  ShaImagesToKeep:
    Type: Number
    Default: 20
    MinValue: 5
    Description: Number of git-SHA tagged images kept in ECR for rollback.

Conditions:
  CreateOidcProvider: !Equals [!Ref ExistingOidcProviderArn, ""]

Resources:
  # GitHub OIDC identity provider. IAM trusts GitHub's CA; thumbprints are kept for older tooling.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
      Tags:
        - { Key: Name, Value: !Sub "${ResourcePrefix}-github-oidc" }

  # Private image repository. SHA tags are immutable; only "latest" moves, because the pipeline watches it.
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref ResourcePrefix
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      ImageTagMutability: IMMUTABLE_WITH_EXCLUSION
      ImageTagMutabilityExclusionFilters:
        - ImageTagMutabilityExclusionFilterType: WILDCARD
          ImageTagMutabilityExclusionFilterValue: latest
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 1 day",
                "selection": { "tagStatus": "untagged", "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 1 },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Keep the last ${ShaImagesToKeep} images for rollback",
                "selection": { "tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": ${ShaImagesToKeep} },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - { Key: Name, Value: !Ref ResourcePrefix }

  # Push access to this repository only.
  EcrPushPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${ResourcePrefix}-github-ecr-push-policy
      Description: Push images to the Onward Orders ECR repository only.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EcrLogin
            Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: "*"
          - Sid: PushToThisRepositoryOnly
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:PutImage
              - ecr:BatchGetImage
              - ecr:DescribeImages
            Resource: !GetAtt EcrRepository.Arn


  # Role GitHub Actions assumes via OIDC, limited to the app repo's main branch (both subject formats).
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ResourcePrefix}-github-actions-role
      Description: Assumed by GitHub Actions via OIDC (temporary credentials only) to push images.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateOidcProvider, !Ref GitHubOidcProvider, !Ref ExistingOidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOrg}/${AppRepo}:ref:refs/heads/${AppBranch}
                  - !Sub repo:${GitHubOrg}@*/${AppRepo}@*:ref:refs/heads/${AppBranch}
      ManagedPolicyArns:
        - !Ref EcrPushPolicy
      Tags:
        - { Key: Name, Value: !Sub "${ResourcePrefix}-github-actions-role" }

Outputs:
  EcrRepositoryName:
    Value: !Ref EcrRepository
    Export: { Name: !Sub "${ResourcePrefix}-ecr-repo-name" }
  EcrRepositoryArn:
    Value: !GetAtt EcrRepository.Arn
    Export: { Name: !Sub "${ResourcePrefix}-ecr-repo-arn" }
  EcrRepositoryUri:
    Value: !GetAtt EcrRepository.RepositoryUri
    Export: { Name: !Sub "${ResourcePrefix}-ecr-repo-uri" }
  GitHubActionsRoleArn:
    Description: Paste into the app repo workflow (role-to-assume). Not a secret.
    Value: !GetAtt GitHubActionsRole.Arn
    Export: { Name: !Sub "${ResourcePrefix}-github-actions-role-arn" }
