AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Onward Logistics - 06 delivery. ECR push (tag latest) -> EventBridge -> CodePipeline ->
  CodeDeploy blue/green on ECS with canary traffic shifting and alarm-based auto rollback.
  The task definition and AppSpec are not defined here: GitHub Actions zips them into the deploy
  bundle in the S3 bundle bucket (01 foundation) and the pipeline reads them from there.
  All roles use customer-managed or AWS-managed policies only.

Parameters:
  ResourcePrefix:
    Type: String
    Default: onward-orders-lab
    AllowedPattern: "^[a-z][a-z0-9-]{2,24}$"
    Description: Naming prefix <project>-<environment> applied to every resource.
  WatchedImageTag:
    Type: String
    Default: latest
    Description: Tag the ECR source action and EventBridge rule react to.
  DeploymentConfigName:
    Type: String
    Default: CodeDeployDefault.ECSCanary10Percent5Minutes
    AllowedValues:
      - CodeDeployDefault.ECSCanary10Percent5Minutes
      - CodeDeployDefault.ECSCanary10Percent15Minutes
      - CodeDeployDefault.ECSLinear10PercentEvery1Minutes
      - CodeDeployDefault.ECSLinear10PercentEvery3Minutes
      - CodeDeployDefault.ECSAllAtOnce
    Description: >-
      Canary 10% for 5 minutes exposes a bad release to a small slice of real traffic while the
      alarms watch, then shifts the rest at once. AllAtOnce is only for emergency fixes.
  BlueTerminationWaitMinutes:
    Type: Number
    Default: 5
    MinValue: 0
    MaxValue: 2880
    Description: Rollback window - the old (blue) tasks stay running this long after success.
  Target5xxThreshold:
    Type: Number
    Default: 5
    Description: Target 5XX responses per minute that stop and roll back a deployment.

Resources:
  # Encrypted, private, versioned bucket for pipeline artifacts.
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${ResourcePrefix}-artifacts-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-artifacts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-artifacts"

  # Denies any non-HTTPS access to the artifact bucket.
  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub ${ArtifactBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # Rolls back a deployment when the app returns 5XX errors.
  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ResourcePrefix}-alb-target-5xx
      AlarmDescription: Application returning 5XX errors - stops and rolls back a CodeDeploy deployment.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !ImportValue
            "Fn::Sub": "${ResourcePrefix}-alb-full-name"
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: !Ref Target5xxThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # Rolls back a deployment when blue tasks become unhealthy.
  BlueUnhealthyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ResourcePrefix}-tg-blue-unhealthy
      AlarmDescription: Unhealthy tasks in the blue target group.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !ImportValue
            "Fn::Sub": "${ResourcePrefix}-alb-full-name"
        - Name: TargetGroup
          Value: !ImportValue
            "Fn::Sub": "${ResourcePrefix}-tg-blue-full-name"
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # Rolls back a deployment when green tasks become unhealthy.
  GreenUnhealthyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ResourcePrefix}-tg-green-unhealthy
      AlarmDescription: Unhealthy tasks in the green target group.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !ImportValue
            "Fn::Sub": "${ResourcePrefix}-alb-full-name"
        - Name: TargetGroup
          Value: !ImportValue
            "Fn::Sub": "${ResourcePrefix}-tg-green-full-name"
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # Role CodeDeploy uses for ECS blue/green deployments.
  CodeDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ResourcePrefix}-codedeploy-role
      Description: CodeDeploy blue/green for ECS.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSCodeDeployRoleForECS
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-codedeploy-role"

  # CodeDeploy application for the order service.
  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub ${ResourcePrefix}-app
      ComputePlatform: ECS
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-app"

  # Blue/green canary deployment with automatic rollback on failure or alarm.
  DeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub ${ResourcePrefix}-dg
      ServiceRoleArn: !GetAtt CodeDeployRole.Arn
      DeploymentConfigName: !Ref DeploymentConfigName
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
          WaitTimeInMinutes: 0
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: !Ref BlueTerminationWaitMinutes
      ECSServices:
        - ClusterName: !ImportValue
            "Fn::Sub": "${ResourcePrefix}-cluster-name"
          ServiceName: !ImportValue
            "Fn::Sub": "${ResourcePrefix}-service-name"
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - TargetGroups:
              - Name: !ImportValue
                  "Fn::Sub": "${ResourcePrefix}-tg-blue-name"
              - Name: !ImportValue
                  "Fn::Sub": "${ResourcePrefix}-tg-green-name"
            ProdTrafficRoute:
              ListenerArns:
                - !ImportValue
                  "Fn::Sub": "${ResourcePrefix}-prod-listener-arn"
            TestTrafficRoute:
              ListenerArns:
                - !ImportValue
                  "Fn::Sub": "${ResourcePrefix}-test-listener-arn"
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_FAILURE
          - DEPLOYMENT_STOP_ON_ALARM
          - DEPLOYMENT_STOP_ON_REQUEST
      AlarmConfiguration:
        Enabled: true
        IgnorePollAlarmFailure: false
        Alarms:
          - Name: !Ref ErrorAlarm
          - Name: !Ref BlueUnhealthyAlarm
          - Name: !Ref GreenUnhealthyAlarm
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-dg"

  # Least-privilege pipeline permissions. ECS register/describe actions do not support resource-level permissions.
  PipelinePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${ResourcePrefix}-pipeline-policy
      Description: Least privilege for the Onward Orders release pipeline.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ArtifactBucket
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:PutObject
              - s3:GetBucketVersioning
              - s3:GetBucketLocation
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub ${ArtifactBucket.Arn}/*
          - Sid: EcrSource
            Effect: Allow
            Action: ecr:DescribeImages
            Resource: !ImportValue
              "Fn::Sub": "${ResourcePrefix}-ecr-repo-arn"
          - Sid: BundleSource
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:GetBucketVersioning
              - s3:GetBucketLocation
            Resource:
              - !ImportValue
                "Fn::Sub": "${ResourcePrefix}-bundle-bucket-arn"
              - !Sub
                - ${BundleBucketArn}/${BundleObjectKey}
                - BundleBucketArn: !ImportValue
                    "Fn::Sub": "${ResourcePrefix}-bundle-bucket-arn"
                  BundleObjectKey: !ImportValue
                    "Fn::Sub": "${ResourcePrefix}-bundle-object-key"
          - Sid: CodeDeploy
            Effect: Allow
            Action:
              - codedeploy:CreateDeployment
              - codedeploy:GetDeployment
              - codedeploy:GetApplication
              - codedeploy:GetApplicationRevision
              - codedeploy:RegisterApplicationRevision
              - codedeploy:GetDeploymentConfig
            Resource:
              - !Sub arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:application:${CodeDeployApplication}
              - !Sub arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentgroup:${CodeDeployApplication}/*
              - !Sub arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentconfig:*
          - Sid: RegisterTaskDefinition
            Effect: Allow
            Action:
              - ecs:RegisterTaskDefinition
              - ecs:DescribeTaskDefinition
              - ecs:DescribeServices
            Resource: "*"
          - Sid: TagTaskDefinitions
            Effect: Allow
            Action: ecs:TagResource
            Resource: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${ResourcePrefix}:*
            Condition:
              StringEquals:
                ecs:CreateAction: RegisterTaskDefinition
          - Sid: PassOnlyTaskRolesToEcs
            Effect: Allow
            Action: iam:PassRole
            Resource:
              - !ImportValue
                "Fn::Sub": "${ResourcePrefix}-task-exec-role-arn"
              - !ImportValue
                "Fn::Sub": "${ResourcePrefix}-task-role-arn"
            Condition:
              StringEquals:
                iam:PassedToService: ecs-tasks.amazonaws.com

  # Role CodePipeline assumes.
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ResourcePrefix}-pipeline-role
      Description: CodePipeline service role for the Onward Orders release pipeline.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Ref PipelinePolicy
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-pipeline-role"

  # Release pipeline: ECR image + S3 deploy bundle -> CodeDeploy. Starts on image push only; a bundle
  # upload alone never starts it (PollForSourceChanges false, and no S3 EventBridge rule).
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub ${ResourcePrefix}-pipeline
      PipelineType: V2
      ExecutionMode: QUEUED
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: Image
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: ECR
                Version: "1"
              Configuration:
                RepositoryName: !ImportValue
                  "Fn::Sub": "${ResourcePrefix}-ecr-repo-name"
                ImageTag: !Ref WatchedImageTag
              OutputArtifacts:
                - Name: ImageArtifact
              RunOrder: 1
            - Name: DeployBundle
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: S3
                Version: "1"
              Configuration:
                S3Bucket: !ImportValue
                  "Fn::Sub": "${ResourcePrefix}-bundle-bucket-name"
                S3ObjectKey: !ImportValue
                  "Fn::Sub": "${ResourcePrefix}-bundle-object-key"
                PollForSourceChanges: false
              OutputArtifacts:
                - Name: BundleArtifact
              RunOrder: 1
        - Name: Deploy
          Actions:
            - Name: BlueGreenToEcs
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: "1"
              Configuration:
                ApplicationName: !Ref CodeDeployApplication
                DeploymentGroupName: !Ref DeploymentGroup
                # Both specs come from the zip GitHub Actions uploaded; the action reads its default
                # files (taskdef.json, appspec.yaml) from the root of that bundle.
                TaskDefinitionTemplateArtifact: BundleArtifact
                AppSpecTemplateArtifact: BundleArtifact
                Image1ArtifactName: ImageArtifact
                Image1ContainerName: IMAGE1_NAME
              InputArtifacts:
                - Name: BundleArtifact
                - Name: ImageArtifact
              RunOrder: 1
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-pipeline"

  # Lets EventBridge start this pipeline and nothing else.
  EventBridgePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${ResourcePrefix}-events-start-pipeline-policy
      Description: Lets EventBridge start the release pipeline and nothing else.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: codepipeline:StartPipelineExecution
            Resource: !Sub arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}

  # Role EventBridge assumes to start the pipeline.
  EventBridgeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ResourcePrefix}-events-pipeline-role
      Description: EventBridge target role for the ECR push rule.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Ref EventBridgePolicy
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-events-pipeline-role"

  # Starts the pipeline when an image with the watched tag is pushed.
  ImagePushRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${ResourcePrefix}-ecr-push-to-pipeline
      Description: Start the release pipeline when a new image is pushed with the watched tag.
      State: ENABLED
      EventPattern:
        source:
          - aws.ecr
        detail-type:
          - ECR Image Action
        detail:
          action-type:
            - PUSH
          result:
            - SUCCESS
          repository-name:
            - !ImportValue
              "Fn::Sub": "${ResourcePrefix}-ecr-repo-name"
          image-tag:
            - !Ref WatchedImageTag
      Targets:
        - Id: StartPipeline
          Arn: !Sub arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}
          RoleArn: !GetAtt EventBridgeRole.Arn

Outputs:
  PipelineName:
    Value: !Ref Pipeline
  CodeDeployApplicationName:
    Value: !Ref CodeDeployApplication
  DeploymentGroupName:
    Value: !Ref DeploymentGroup
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
