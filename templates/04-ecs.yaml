AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Onward Logistics - 04 ECS. Fargate cluster, log group, task execution and task roles
  (managed policies only), the BOOTSTRAP task definition, and the ECS service controlled by
  CodeDeploy (blue/green). Tasks run in private subnets with no public IP.

Parameters:
  ResourcePrefix:
    Type: String
    Default: onward-orders-lab
    AllowedPattern: "^[a-z][a-z0-9-]{2,24}$"
    Description: Naming prefix <project>-<environment> applied to every resource.
  TaskCpu:
    Type: String
    Default: "256"
    AllowedValues: ["256", "512", "1024"]
    Description: 0.25 vCPU is enough for a 2-worker gunicorn app; scaling is horizontal, not vertical.
  TaskMemory:
    Type: String
    Default: "512"
    AllowedValues: ["512", "1024", "2048"]
    Description: Flask + gunicorn uses well under 200 MiB; 512 MiB is the smallest valid size for 0.25 vCPU.
  AppPort:
    Type: Number
    Default: 8080
  BootstrapImageTag:
    Type: String
    Default: latest
    Description: Image used only for the first deployment. Later versions are released by CodeDeploy.
  DesiredCount:
    Type: Number
    Default: 2
    MinValue: 0
    Description: Initial task count. Auto scaling (05) owns the count after creation. Minimum 2 for HA.
  HealthCheckGracePeriod:
    Type: Number
    Default: 60
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]

Resources:
  # Fargate cluster with Container Insights.
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${ResourcePrefix}-cluster
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      CapacityProviders: [FARGATE]
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
      Tags:
        - { Key: Name, Value: !Sub "${ResourcePrefix}-cluster" }

  # Container log group.
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${ResourcePrefix}
      RetentionInDays: !Ref LogRetentionDays

  # Role the ECS agent uses to pull images and write logs.
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ResourcePrefix}-task-exec-role
      Description: ECS agent role - pull from ECR and write to CloudWatch Logs.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - { Key: Name, Value: !Sub "${ResourcePrefix}-task-exec-role" }

  # Application permissions: none today, with an explicit deny on privilege escalation.
  TaskRolePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${ResourcePrefix}-task-role-policy
      Description: Least privilege for the order app container (currently no AWS API access).
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyPrivilegeEscalation
            Effect: Deny
            Action:
              - iam:*
              - sts:AssumeRole
              - organizations:*
            Resource: "*"

  # Role the application container runs as.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ResourcePrefix}-task-role
      Description: Application role for the order system containers.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Ref TaskRolePolicy
      Tags:
        - { Key: Name, Value: !Sub "${ResourcePrefix}-task-role" }

  # Bootstrap revision only. CodeDeploy registers later revisions from the app repo's taskdef.json; do not edit to release.
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref ResourcePrefix
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Sub
            - "${RepoUri}:${BootstrapImageTag}"
            - RepoUri: !ImportValue { "Fn::Sub": "${ResourcePrefix}-ecr-repo-uri" }
          Essential: true
          PortMappings:
            - ContainerPort: !Ref AppPort
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
      Tags:
        - { Key: Name, Value: !Ref ResourcePrefix }

  # ECS service in private subnets with no public IP, deployed blue/green by CodeDeploy.
  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub ${ResourcePrefix}-service
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: !Ref DesiredCount
      DeploymentController:
        Type: CODE_DEPLOY
      HealthCheckGracePeriodSeconds: !Ref HealthCheckGracePeriod
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Split [",", !ImportValue { "Fn::Sub": "${ResourcePrefix}-private-subnet-ids" }]
          SecurityGroups:
            - !ImportValue { "Fn::Sub": "${ResourcePrefix}-task-sg-id" }
      LoadBalancers:
        - ContainerName: app
          ContainerPort: !Ref AppPort
          TargetGroupArn: !ImportValue { "Fn::Sub": "${ResourcePrefix}-tg-blue-arn" }
      Tags:
        - { Key: Name, Value: !Sub "${ResourcePrefix}-service" }

Outputs:
  ClusterName:
    Value: !Ref Cluster
    Export: { Name: !Sub "${ResourcePrefix}-cluster-name" }
  ServiceName:
    Value: !GetAtt Service.Name
    Export: { Name: !Sub "${ResourcePrefix}-service-name" }
  TaskExecutionRoleArn:
    Value: !GetAtt TaskExecutionRole.Arn
    Export: { Name: !Sub "${ResourcePrefix}-task-exec-role-arn" }
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
    Export: { Name: !Sub "${ResourcePrefix}-task-role-arn" }
  LogGroupName:
    Value: !Ref LogGroup
    Export: { Name: !Sub "${ResourcePrefix}-log-group" }
