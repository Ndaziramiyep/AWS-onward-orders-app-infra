AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Onward Logistics - 02 network. VPC across two AZs: public subnets for the ALB only, private
  subnets for tasks and endpoints with NO default route and NO NAT gateway. AWS services are
  reached through VPC endpoints. Security groups are chained (ALB -> tasks -> endpoints).

Parameters:
  ResourcePrefix:
    Type: String
    Default: onward-orders-lab
    AllowedPattern: "^[a-z][a-z0-9-]{2,24}$"
    Description: Naming prefix <project>-<environment> applied to every resource.
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
  PublicSubnetACidr:
    Type: String
    Default: 10.20.0.0/24
  PublicSubnetBCidr:
    Type: String
    Default: 10.20.1.0/24
  PrivateSubnetACidr:
    Type: String
    Default: 10.20.10.0/24
  PrivateSubnetBCidr:
    Type: String
    Default: 10.20.11.0/24
  S3PrefixListId:
    Type: String
    Default: pl-6da54004
    Description: >-
      AWS-managed prefix list for S3 in this region (eu-west-1 = pl-6da54004). Find it with
      aws ec2 describe-managed-prefix-lists --filters Name=prefix-list-name,Values=com.amazonaws.<region>.s3
  TestListenerIngressCidr:
    Type: String
    Default: 10.20.0.0/16
    Description: >-
      Who may reach the CodeDeploy test listener (:8080) to preview the green version.
      Defaults to inside the VPC only. Set to <your-ip>/32 temporarily to preview green yourself.
  AppPort:
    Type: Number
    Default: 8080

Resources:
  # VPC spanning two availability zones.
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-vpc"

  # Internet gateway, used by the public subnets only.
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-igw"

  # Attaches the internet gateway to the VPC.
  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # Public subnet in AZ a, for the ALB only.
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetACidr
      AvailabilityZone: !Select
        - 0
        - !GetAZs ""
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-public-a"
        - Key: Tier
          Value: public

  # Public subnet in AZ b, for the ALB only.
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetBCidr
      AvailabilityZone: !Select
        - 1
        - !GetAZs ""
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-public-b"
        - Key: Tier
          Value: public

  # Private subnet in AZ a, for tasks and interface endpoints.
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetACidr
      AvailabilityZone: !Select
        - 0
        - !GetAZs ""
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-private-a"
        - Key: Tier
          Value: private

  # Private subnet in AZ b, for tasks and interface endpoints.
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetBCidr
      AvailabilityZone: !Select
        - 1
        - !GetAZs ""
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-private-b"
        - Key: Tier
          Value: private

  # Route table shared by the public subnets.
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-public-rt"

  # Internet route for the public subnets.
  PublicInternetRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  # Associates public subnet A with the public route table.
  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  # Associates public subnet B with the public route table.
  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # Private route table for AZ a: no default route, AWS is reached through VPC endpoints.
  PrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-private-rt-a"

  # Private route table for AZ b: no default route, AWS is reached through VPC endpoints.
  PrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-private-rt-b"

  # Associates private subnet A with its route table.
  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTableA

  # Associates private subnet B with its route table.
  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTableB

  # ALB security group. The 127.0.0.1/32 egress rule replaces the default allow-all.
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${ResourcePrefix}-alb-sg
      GroupDescription: Internet-facing ALB. HTTP/HTTPS from anywhere, test listener restricted.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Production HTTP
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Production HTTPS
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: !Ref TestListenerIngressCidr
          Description: CodeDeploy test listener
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 127.0.0.1/32
          Description: Removes default allow-all egress
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-alb-sg"

  # Fargate task security group, reachable only from the ALB.
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${ResourcePrefix}-task-sg
      GroupDescription: ECS Fargate tasks. Reachable only from the ALB.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 127.0.0.1/32
          Description: Removes default allow-all egress
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-task-sg"

  # Interface endpoint security group, HTTPS from tasks only.
  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${ResourcePrefix}-endpoint-sg
      GroupDescription: Interface VPC endpoints. HTTPS only from the tasks.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 127.0.0.1/32
          Description: Removes default allow-all egress
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-endpoint-sg"

  # ALB to tasks on the app port. Cross-group rules are separate to avoid circular references.
  AlbToTaskEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref AppPort
      ToPort: !Ref AppPort
      DestinationSecurityGroupId: !Ref TaskSecurityGroup
      Description: ALB to tasks (traffic and health checks)

  # Tasks accept the app port from the ALB only.
  TaskFromAlbIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref AppPort
      ToPort: !Ref AppPort
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: App port only from the ALB

  # Tasks to interface endpoints (ECR, Logs) over HTTPS.
  TaskToEndpointEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref EndpointSecurityGroup
      Description: HTTPS to interface endpoints (ECR, Logs)

  # Tasks to S3 over HTTPS, for ECR image layers via the gateway endpoint.
  TaskToS3Egress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationPrefixListId: !Ref S3PrefixListId
      Description: HTTPS to S3 gateway endpoint (ECR image layers)

  # Interface endpoints accept HTTPS from tasks only.
  EndpointFromTaskIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref TaskSecurityGroup
      Description: HTTPS only from tasks

  # S3 gateway endpoint, limited to the AWS-owned bucket that serves ECR image layers.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTableA
        - !Ref PrivateRouteTableB
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EcrImageLayersOnly
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub arn:${AWS::Partition}:s3:::prod-${AWS::Region}-starport-layer-bucket/*

  # Interface endpoint for the ECR API.
  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ecr.api
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-vpce-ecr-api"

  # Interface endpoint for ECR Docker image pulls.
  EcrDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ecr.dkr
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-vpce-ecr-dkr"

  # Interface endpoint for CloudWatch Logs.
  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.logs
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-vpce-logs"

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export:
      Name: !Sub "${ResourcePrefix}-vpc-id"
  VpcCidr:
    Value: !Ref VpcCidr
    Export:
      Name: !Sub "${ResourcePrefix}-vpc-cidr"
  PublicSubnetIds:
    Value: !Join
      - ","
      -   - !Ref PublicSubnetA
          - !Ref PublicSubnetB
    Export:
      Name: !Sub "${ResourcePrefix}-public-subnet-ids"
  PrivateSubnetIds:
    Value: !Join
      - ","
      -   - !Ref PrivateSubnetA
          - !Ref PrivateSubnetB
    Export:
      Name: !Sub "${ResourcePrefix}-private-subnet-ids"
  AlbSecurityGroupId:
    Value: !Ref AlbSecurityGroup
    Export:
      Name: !Sub "${ResourcePrefix}-alb-sg-id"
  TaskSecurityGroupId:
    Value: !Ref TaskSecurityGroup
    Export:
      Name: !Sub "${ResourcePrefix}-task-sg-id"
  EndpointSecurityGroupId:
    Value: !Ref EndpointSecurityGroup
    Export:
      Name: !Sub "${ResourcePrefix}-endpoint-sg-id"
