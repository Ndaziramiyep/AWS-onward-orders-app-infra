# Static checks on every pull request and push to main. No AWS access needed.
name: lint-templates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: CloudFormation syntax and best practices
        run: cfn-lint --regions eu-west-1 -- bootstrap/*.yaml templates/*.yaml

      # Company rule: IAM permissions come from managed policies only.
      - name: No inline IAM policies
        run: |
          grep -RnE "^\s*Policies:|AWS::IAM::Policy\b" bootstrap templates && { echo "Inline IAM policies are not allowed"; exit 1; }
          echo "OK - managed policies only"

      # Company rule: private subnets have no path to the internet.
      - name: No routes on private route tables
        shell: python
        run: |
          import glob, sys
          from cfnlint.decode.cfn_yaml import load
          bad = [f"{path}: {name}" for path in sorted(glob.glob("templates/*.yaml"))
                 for name, res in load(path)["Resources"].items()
                 if res["Type"] == "AWS::EC2::Route" and "Private" in str(res["Properties"]["RouteTableId"])]
          if bad:
              sys.exit("Routes on private route tables:\n" + "\n".join(bad))
          print("OK - private route tables have no routes")
